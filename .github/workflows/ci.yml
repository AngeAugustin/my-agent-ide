name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verifier:
    name: Types, tests et compilation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest : puces Apple (arm64) ; macos-15-intel : Mac Intel (x64).
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Vérifie que l'installateur Windows (et son désinstallateur personnalisé) se compile.
      - name: Installateur Windows
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
