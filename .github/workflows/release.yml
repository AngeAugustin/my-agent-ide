name: Installateurs

# Crée les installateurs Windows, macOS et Linux quand une étiquette « v* » est poussée
# (ex. : git tag v0.1.0 && git push --tags), ou à la demande depuis l'onglet Actions.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installateurs:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Construire les installateurs
        run: npx electron-builder --publish never
        env:
          # Sans certificat de signature configuré, les installateurs ne sont pas signés.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: my-agent-ide-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  publication:
    needs: installateurs
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installateurs
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installateurs/*
          draft: true
